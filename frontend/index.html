<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SceneForge AI</title>
  <meta name="description" content="Describe a scene in plain words and get a blocked, shot-listed 3D previs built from real motion-capture data." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161c23'/%3E%3Ccircle cx='16' cy='9' r='3.2' fill='%23f2b33d'/%3E%3Cpath d='M16 13v8m0 0-5 7m5-7 5 7M9 16h14' stroke='%23e6ebf0' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
  </script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--surface-3)"/><circle cx="16" cy="9" r="3.2" fill="var(--accent)"/><path d="M16 13v8m0 0-5 7m5-7 5 7M9 16h14" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span class="wordmark">SceneForge</span>
      <span class="divider" aria-hidden="true"></span>
      <span class="scene-title" id="sceneTitle">No scene yet</span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"><i></i><span>Starting</span></div>
  </header>

  <main class="layout">
    <!-- ======================= brief -->
    <section class="panel brief" aria-label="Scene brief">
      <div class="field">
        <label class="label" for="prompt">Scene</label>
        <div class="editor">
          <textarea id="prompt" rows="6" spellcheck="true" placeholder="Who is in it, what they do, and how to shoot it.">Two fighters circle each other. One lunges with a punch, the other dodges and falls. Slow push-in on the winner.</textarea>
          <div class="editor-bar">
            <button id="mic" class="icon-btn" type="button" aria-pressed="false" title="Dictate the scene">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm6-3a6 6 0 0 1-12 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span>Dictate</span>
            </button>
            <label class="sr" for="lang">Dictation language</label>
            <select id="lang" class="mini" title="Dictation language">
              <option value="en-IN">English (India)</option>
              <option value="hi-IN">Hindi</option>
              <option value="te-IN">Telugu</option>
              <option value="en-US">English (US)</option>
            </select>
            <span class="count" id="count">0</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label" for="provider">Planner</label>
        <select id="provider"><option value="auto">Automatic</option></select>
      </div>

      <button id="go" class="primary" type="button">
        <span>Direct scene</span><kbd>Ctrl ↵</kbd>
      </button>

      <div class="field">
        <span class="label">Examples</span>
        <ul class="chips" id="examples"></ul>
      </div>

      <p class="credit">Motion from the <a href="http://mocap.cs.cmu.edu" target="_blank" rel="noopener">CMU Motion Capture Database</a>.</p>
    </section>

    <!-- ======================= stage -->
    <section class="stage" aria-label="3D previs">
      <div class="viewport" id="viewport">
        <canvas id="gl"></canvas>
        <div class="hud">
          <div class="hud-shot" id="hudShot"></div>
          <div class="hud-rec" id="hudRec" hidden>Recording</div>
          <div class="hud-tc" id="hudTc">00:00:00:00</div>
        </div>
        <div class="loading" id="loading" hidden><span class="spinner" aria-hidden="true"></span>Directing scene</div>
        <div class="empty" id="empty" hidden>
          <p>Write a scene and choose <b>Direct scene</b>.</p>
        </div>
      </div>

      <div class="transport">
        <div class="group">
          <button id="restart" class="icon-btn square" type="button" title="Back to start" aria-label="Back to start">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </button>
          <button id="play" class="icon-btn square play" type="button" title="Play / pause (space)" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M8 5v14l11-7z" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="seg" role="radiogroup" aria-label="Camera">
          <button type="button" class="on" data-cam="director" role="radio" aria-checked="true">Director's camera</button>
          <button type="button" data-cam="free" role="radio" aria-checked="false">Free camera</button>
        </div>
        <label class="switch"><input type="checkbox" id="labels" checked /><span></span>Names</label>
        <label class="switch"><input type="checkbox" id="loop" checked /><span></span>Loop</label>
        <span class="spacer"></span>
        <button id="record" class="ghost" type="button" title="Render the director's cut to a video file"><i class="rec-dot"></i><span>Record video</span></button>
      </div>

      <div class="timeline" id="timeline" aria-label="Timeline"></div>
    </section>

    <!-- ======================= inspector -->
    <section class="panel inspector" aria-label="Inspector">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="trace">Agents</button>
        <button role="tab" aria-selected="false" data-tab="shots">Shot list</button>
        <button role="tab" aria-selected="false" data-tab="json">Export</button>
      </div>
      <div class="tab" id="tab-trace"></div>
      <div class="tab" id="tab-shots" hidden></div>
      <div class="tab" id="tab-json" hidden>
        <div class="export-actions">
          <button id="dlJson" class="ghost" type="button">Download plan (JSON)</button>
          <button id="dlCsv" class="ghost" type="button">Download shot list (CSV)</button>
        </div>
        <pre id="json"></pre>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
